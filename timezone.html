<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>City Match Clocks</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div>
          <p class="eyebrow">Matched city time</p>
          <h1>City Match</h1>
        </div>
        <div class="header-tools">
          <nav class="site-nav" aria-label="Pages">
            <a href="index.html">Scales</a>
            <a href="timezone.html" aria-current="page">Cities</a>
          </nav>
          <time id="matchStamp" datetime=""></time>
        </div>
      </header>

      <section aria-labelledby="timezoneTitle">
        <div class="section-heading">
          <h2 id="timezoneTitle">24-Hour Match</h2>
          <button id="useCurrentTime" class="plain-button" type="button">Use current time</button>
        </div>
        <div class="clock-grid timezone-grid">
          <article class="clock-card city-clock" data-slot="left">
            <div class="clock-top">
              <div>
                <h3 class="clock-title" data-title="left"></h3>
                <p class="clock-subtitle" data-subtitle="left"></p>
              </div>
              <p class="clock-value" data-value="left"></p>
            </div>
            <label class="city-picker">
              <span>City</span>
              <input id="leftCitySearch" list="cityOptions" autocomplete="off" spellcheck="false">
            </label>
            <label class="time-control">
              <span data-time-label="left"></span>
              <input id="leftTimeInput" type="datetime-local" step="60">
            </label>
            <div class="time-stepper" aria-label="Adjust left clock time by hour">
              <button type="button" data-step-slot="left" data-step-hours="-1">-1 hour</button>
              <button type="button" data-step-slot="left" data-step-hours="1">+1 hour</button>
            </div>
            <div class="clock-face-wrap" data-face="left"></div>
          </article>

          <article class="clock-card city-clock" data-slot="right">
            <div class="clock-top">
              <div>
                <h3 class="clock-title" data-title="right"></h3>
                <p class="clock-subtitle" data-subtitle="right"></p>
              </div>
              <p class="clock-value" data-value="right"></p>
            </div>
            <label class="city-picker">
              <span>City</span>
              <input id="rightCitySearch" list="cityOptions" autocomplete="off" spellcheck="false">
            </label>
            <label class="time-control">
              <span data-time-label="right"></span>
              <input id="rightTimeInput" type="datetime-local" step="60">
            </label>
            <div class="time-stepper" aria-label="Adjust right clock time by hour">
              <button type="button" data-step-slot="right" data-step-hours="-1">-1 hour</button>
              <button type="button" data-step-slot="right" data-step-hours="1">+1 hour</button>
            </div>
            <div class="clock-face-wrap" data-face="right"></div>
          </article>
        </div>
        <datalist id="cityOptions"></datalist>
      </section>
    </main>

    <script src="timezone.js"></script>
  </body>
</html>
