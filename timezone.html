<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>City Match Clocks</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div>
          <p class="eyebrow">Matched city time</p>
          <h1>City Match</h1>
        </div>
        <div class="header-tools">
          <nav class="site-nav" aria-label="Pages">
            <a href="index.html">Scales</a>
            <a href="timezone.html" aria-current="page">Cities</a>
          </nav>
          <time id="matchStamp" datetime=""></time>
        </div>
      </header>

      <section aria-labelledby="timezoneTitle">
        <div class="section-heading">
          <h2 id="timezoneTitle">24-Hour Match</h2>
          <div class="section-actions">
            <button id="findMeetingTime" class="plain-button" type="button">Find shared waking time</button>
            <button id="addClock" class="plain-button" type="button">+ Clock</button>
            <button id="useCurrentTime" class="plain-button" type="button">Use current time</button>
          </div>
        </div>
        <p id="meetingMessage" class="meeting-status" role="status"></p>
        <div id="digitalClocks" class="digital-grid" aria-label="Digital city times"></div>
        <div id="cityClocks" class="clock-grid timezone-grid"></div>
        <p class="timezone-note">Search any city field to swap cities; all clocks keep the same matched instant. Add up to 4 clocks.</p>
        <datalist id="cityOptions"></datalist>
      </section>
    </main>

    <script src="timezone.js"></script>
  </body>
</html>
